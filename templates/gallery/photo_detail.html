{% extends 'base.html' %}

{% block content %}

<div class="bg-white shadow rounded-lg overflow-hidden">

    <img
        src="{{ photo.image.url }}"
        class="w-full max-h-[600px] object-cover"
    >

    <div class="p-6">

        <h1 class="text-3xl font-bold mb-4">
            {{ photo.title }}
        </h1>

        <p class="mb-4">
            {{ photo.description }}
        </p>

        <p class="text-gray-600 mb-4">
            Tags: {{ photo.tags }}
        </p>

        <p>
             {{ photo.total_likes }} Likes
        </p>

    </div>

</div>

{% endblock %}
