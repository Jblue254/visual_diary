{% extends 'base.html' %}

{% block content %}

<div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow">

    <h2 class="text-3xl font-bold mb-4">
        Upload Photo
    </h2>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button
            class="bg-purple-600 text-white px-4 py-2 rounded"
        >
            Upload
        </button>

    </form>

</div>

{% endblock %}
